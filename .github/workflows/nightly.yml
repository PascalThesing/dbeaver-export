name: Nightly compatibility (DBeaver main)
# Runs nightly against DBeaver main to catch upstream API breakage early.

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-against-latest-release:
    # full perf tier only on schedule/dispatch - pushes are covered by build.yml
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: exportnow
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EXPORTNOW_PG_URL: jdbc:postgresql://localhost:15432/postgres
      EXPORTNOW_PG_USER: postgres
      EXPORTNOW_PG_PASSWORD: exportnow
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Xvfb and GTK (for UI tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxtst6 libgtk-3-0t64 || sudo apt-get install -y xvfb libxtst6 libgtk-3-0

      - name: Run all tests against the latest DBeaver release (full perf tier)
        run: xvfb-run -a ./mvnw -B -ntp verify -Dexportnow.perf=full
        env:
          NO_AT_BRIDGE: "1"

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-diagnostics
          path: |
            tests/**/target/surefire-reports/**
            tests/**/target/work/data/.metadata/.log

  build-against-dbeaver-main:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin

      - uses: actions/checkout@v7
        with:
          repository: dbeaver/dbeaver
          path: dbeaver

      - uses: actions/checkout@v7
        with:
          repository: dbeaver/dbeaver-common
          path: dbeaver-common

      - uses: actions/checkout@v7
        with:
          repository: dbeaver/datadam-api
          path: datadam-api

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build DBeaver main p2 repository
        run: ./plugin/mvnw -B -ntp package -DskipTests -f dbeaver/product/aggregate/pom.xml -Pproduct-dbeaver-eclipse-ce

      - name: Locate built repository
        id: repo
        run: |
          REPO_DIR="$GITHUB_WORKSPACE/dbeaver/product/repositories/org.jkiss.dbeaver.ce.repository/target/repository"
          if [ ! -f "$REPO_DIR/content.jar" ] && [ ! -f "$REPO_DIR/content.xml" ]; then
            echo "CE p2 repository not found at $REPO_DIR" >&2; exit 1
          fi
          echo "url=file://$REPO_DIR" >> "$GITHUB_OUTPUT"
          echo "Using repository: $REPO_DIR"

      - name: Install Xvfb and GTK (for UI tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxtst6 libgtk-3-0t64 || sudo apt-get install -y xvfb libxtst6 libgtk-3-0

      - name: Build plugin against DBeaver main
        run: >
          xvfb-run -a ./plugin/mvnw -B -ntp verify -f plugin/pom.xml
          -Ddbeaver.target.file=dbeaver-nightly
          -Ddbeaver.repo.url='${{ steps.repo.outputs.url }}'
        env:
          NO_AT_BRIDGE: "1"
