name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: exportnow
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EXPORTNOW_PG_URL: jdbc:postgresql://localhost:15432/postgres
      EXPORTNOW_PG_USER: postgres
      EXPORTNOW_PG_PASSWORD: exportnow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Xvfb and GTK (for UI tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxtst6 libgtk-3-0t64 || sudo apt-get install -y xvfb libxtst6 libgtk-3-0

      - name: Build plugin and update site
        run: xvfb-run -a ./mvnw -B -ntp verify
        env:
          NO_AT_BRIDGE: "1"

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            tests/**/target/surefire-reports/**
            tests/**/target/work/data/.metadata/.log

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: exportnow-plugin-jar
          path: plugins/org.jkiss.dbeaver.ext.exportnow/target/org.jkiss.dbeaver.ext.exportnow-*.jar

      - name: Upload update site zip
        uses: actions/upload-artifact@v4
        with:
          name: exportnow-update-site
          path: releng/repository/target/org.jkiss.dbeaver.ext.exportnow.repository-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            plugins/org.jkiss.dbeaver.ext.exportnow/target/org.jkiss.dbeaver.ext.exportnow-*.jar
            releng/repository/target/org.jkiss.dbeaver.ext.exportnow.repository-*.zip
