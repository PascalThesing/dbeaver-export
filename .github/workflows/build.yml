name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: exportnow
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EXPORTNOW_PG_URL: jdbc:postgresql://localhost:15432/postgres
      EXPORTNOW_PG_USER: postgres
      EXPORTNOW_PG_PASSWORD: exportnow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Xvfb and GTK (for UI tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxtst6 libgtk-3-0t64 || sudo apt-get install -y xvfb libxtst6 libgtk-3-0

      - name: Build plugin and update site
        run: xvfb-run -a ./mvnw -B -ntp verify
        env:
          NO_AT_BRIDGE: "1"

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            tests/**/target/surefire-reports/**
            tests/**/target/work/data/.metadata/.log

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: exportnow-plugin-jar
          path: plugins/org.jkiss.dbeaver.ext.exportnow/target/org.jkiss.dbeaver.ext.exportnow-*.jar

      - name: Upload update site zip
        uses: actions/upload-artifact@v4
        with:
          name: exportnow-update-site
          path: releng/repository/target/org.jkiss.dbeaver.ext.exportnow.repository-*.zip

      # PR test build: the repository folder itself is the artifact, so the zip
      # GitHub serves is the update site and installs directly in DBeaver
      - name: Upload PR test update site
        id: pr-site
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: exportnow-update-site-pr${{ github.event.pull_request.number }}
          path: releng/repository/target/repository/
          retention-days: 30

      - name: Comment test build on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.pr-site.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- exportnow-test-build -->';
            const pr = context.payload.pull_request;
            const sha = pr.head.sha.substring(0, 7);
            const name = `exportnow-update-site-pr${pr.number}`;
            const body = [
              marker,
              `### Test build for ${sha}`,
              '',
              `Download: [${name}.zip](${process.env.ARTIFACT_URL}) (kept 30 days, GitHub login required)`,
              '',
              'Install in DBeaver:',
              '1. *Help → Install New Software… → Add… → Archive…* and select the downloaded zip (no need to unpack).',
              '2. Select *DBeaver Headless Export Command*, finish the wizard and restart DBeaver.',
              '',
              'To update to a newer test build, uninstall the old one first via *Help → About → Installation Details*.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pr.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            }

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            plugins/org.jkiss.dbeaver.ext.exportnow/target/org.jkiss.dbeaver.ext.exportnow-*.jar
            releng/repository/target/org.jkiss.dbeaver.ext.exportnow.repository-*.zip
